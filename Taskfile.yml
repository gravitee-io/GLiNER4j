  # ── GLiClass decoder-kv router (Qwen3 backbone on llama.cpp via llamaj.cpp) ─────
  # Backbone → GGUF (f16 + q8_0) with llama.cpp's convert_hf_to_gguf.py; scorer → ONNX (+fp16/int8).
  # Runs through the gliner4j-llamacpp module (Java 25).

  scx-router:
    desc: "Download + export the SCX GLiClass router (Qwen3-0.6B decoder-kv): GGUF backbone + ONNX scorer + reference scores"
    deps:
      - check:uv
    preconditions:
      - sh: test -f {{.LLAMA_CPP_DIR}}/convert_hf_to_gguf.py
        msg: "llama.cpp checkout not found at {{.LLAMA_CPP_DIR}} (set LLAMA_CPP_DIR); needed for convert_hf_to_gguf.py"
    cmds:
      - uvx --from huggingface-hub hf download {{.SCX_ROUTER_HF_MODEL}} --local-dir {{.SCX_ROUTER_HF_LOCAL_DIR}}
      - uv run scripts/export_gliclass_decoder_kv.py --model-path {{.SCX_ROUTER_HF_LOCAL_DIR}} --output-dir {{.SCX_ROUTER_OUTPUT_DIR}} --llama-cpp-dir {{.LLAMA_CPP_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py scx-router {{.SCX_ROUTER_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_gliclass_decoder_kv.py
    generates:
      - "{{.SCX_ROUTER_OUTPUT_DIR}}/gguf/backbone-q8_0.gguf"
      - "{{.SCX_ROUTER_OUTPUT_DIR}}/onnx/scorer.onnx"
      - "{{.SCX_ROUTER_OUTPUT_DIR}}/reference.json"

  demo:scx-router:
    desc: "Run the demo: SCX LLM router (model/task/reasoning/difficulty/length) + streaming session, interactive (needs: task scx-router, Java 25; EP=auto offloads to Metal/CUDA)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "auto"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="scx_router {{.VARIANT}} {{.EP}}" 2>/dev/null

  stream-pii:
    desc: "Download + export GLiNER Stream PII (streaming span NER, Qwen3-0.6B): GGUF backbone + ggml span head + reference outputs"
    deps:
      - check:uv
    preconditions:
      - sh: test -f {{.LLAMA_CPP_DIR}}/convert_hf_to_gguf.py
        msg: "llama.cpp checkout not found at {{.LLAMA_CPP_DIR}} (set LLAMA_CPP_DIR); needed for convert_hf_to_gguf.py"
    cmds:
      - uvx --from huggingface-hub hf download {{.STREAM_PII_HF_MODEL}} --local-dir {{.STREAM_PII_HF_LOCAL_DIR}}
      - uv run scripts/export_gliner_streaming_span.py --model-path {{.STREAM_PII_HF_LOCAL_DIR}} --output-dir {{.STREAM_PII_OUTPUT_DIR}} --llama-cpp-dir {{.LLAMA_CPP_DIR}}
      - uv run scripts/render_model_card.py stream-pii {{.STREAM_PII_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_gliner_streaming_span.py
    generates:
      - "{{.STREAM_PII_OUTPUT_DIR}}/gguf/backbone-q8_0.gguf"
      - "{{.STREAM_PII_OUTPUT_DIR}}/gguf/scorer.gguf"

  demo:stream-pii:
    desc: "Run the demo: streaming PII NER — stateless samples, chunked sessions with revised snapshots, interactive /stream (needs: task stream-pii, Java 25)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "auto"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="stream_pii {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── HuggingFace uploads for the GLiNER2.5 and llama.cpp bundles ─────────────
  hf-upload:gliner2dot5:
    desc: "Mirror the GLiNER2.5 base bundle to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally, skips local optimized-graph caches)"
