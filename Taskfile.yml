    cmds:
      - uv run scripts/render_model_card.py ggml-gliclass-edge models/gliclass-edge-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliclass-edge-llamacpp . --delete "*" --commit-message "Upload gliclass-edge ggml bundle (engine=llamacpp) + model card"

  hf-upload:gliner-pii:llamacpp:
    desc: "Mirror the gliner-pii llama.cpp/ggml bundle (models/gliner-pii-base-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner-pii-base-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner-pii-base-llamacpp not found. Run: task gliner-pii:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-gliner-pii models/gliner-pii-base-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner-pii-base-llamacpp . --delete "*" --commit-message "Upload gliner-pii ggml bundle (engine=llamacpp) + model card"

  hf-upload:gliner-bi:llamacpp:
    desc: "Mirror the gliner-bi llama.cpp/ggml bundle (models/gliner-bi-small-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner-bi-small-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner-bi-small-llamacpp not found. Run: task gliner-bi:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-gliner-bi models/gliner-bi-small-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner-bi-small-llamacpp . --delete "*" --commit-message "Upload gliner-bi ggml bundle (engine=llamacpp) + model card"

  hf-upload:gliner-multitask:llamacpp:
    desc: "Mirror the gliner-multitask llama.cpp/ggml bundle (models/gliner-multitask-large-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner-multitask-large-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner-multitask-large-llamacpp not found. Run: task gliner-multitask:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-gliner-multitask models/gliner-multitask-large-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner-multitask-large-llamacpp . --delete "*" --commit-message "Upload gliner-multitask ggml bundle (engine=llamacpp) + model card"

  hf-upload:base:llamacpp:
    desc: "Mirror the base llama.cpp/ggml bundle (models/gliner2-base-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner2-base-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner2-base-llamacpp not found. Run: task base:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-base models/gliner2-base-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner2-base-llamacpp . --delete "*" --commit-message "Upload base ggml bundle (engine=llamacpp) + model card"

  hf-upload:pii:llamacpp:
