# https://taskfile.dev
version: "3"

vars:
  # Base model (fastino/gliner2-base-v1)
  BASE_HF_MODEL: "fastino/gliner2-base-v1"
  BASE_HF_LOCAL_DIR: "models/gliner2-base-hf"
  BASE_ONNX_OUTPUT_DIR: "models/gliner2-base-onnx"

  # PII model (fastino/gliner2-privacy-filter-PII-multi)
  PII_HF_MODEL: "fastino/gliner2-privacy-filter-PII-multi"
  PII_HF_LOCAL_DIR: "models/gliner2-privacy-hf"
  PII_ONNX_OUTPUT_DIR: "models/gliner2-privacy-onnx"

  # GLiGuard model (fastino/gliguard-LLMGuardrails-300M)
  GLIGUARD_HF_MODEL: "fastino/gliguard-LLMGuardrails-300M"
  GLIGUARD_HF_LOCAL_DIR: "models/gliguard-hf"
  GLIGUARD_ONNX_OUTPUT_DIR: "models/gliguard-onnx"

  # GLiClass model (knowledgator/gliclass-modern-base-v3.0 — ModernBERT zero-shot classification)
  GLICLASS_HF_MODEL: "knowledgator/gliclass-modern-base-v3.0"
  GLICLASS_ONNX_OUTPUT_DIR: "models/gliclass-modern-base-onnx"

  # GLiClass V3 config-swap variants (same uni-encoder + score-head pipeline — export & load, no code)
  GLICLASS_X_HF_MODEL: "knowledgator/gliclass-x-base" # multilingual (mdeberta-v3-base)
  GLICLASS_X_ONNX_OUTPUT_DIR: "models/gliclass-x-onnx"
  GLICLASS_MODERN_LARGE_HF_MODEL: "knowledgator/gliclass-modern-large-v3.0"
  GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR: "models/gliclass-modern-large-onnx"
  GLICLASS_LARGE_HF_MODEL: "knowledgator/gliclass-large-v3.0"
  GLICLASS_LARGE_ONNX_OUTPUT_DIR: "models/gliclass-large-onnx"
  GLICLASS_EDGE_HF_MODEL: "knowledgator/gliclass-edge-v3.0"
  GLICLASS_EDGE_ONNX_OUTPUT_DIR: "models/gliclass-edge-onnx"

  # GLiNER NER families (original-GLiNER uni/bi-encoder span models — zero-shot NER)
  GLINER_PII_HF_MODEL: "knowledgator/gliner-pii-base-v1.0" # uni-encoder, deberta-v3-small
  GLINER_PII_ONNX_OUTPUT_DIR: "models/gliner-pii-base-onnx"
  GLINER_BI_HF_MODEL: "knowledgator/gliner-bi-small-v1.0" # bi-encoder, deberta + MiniLM
  GLINER_BI_ONNX_OUTPUT_DIR: "models/gliner-bi-small-onnx"

tasks:
  default:
    desc: Default — runs the base all-in-one chain (download + export, FP16 + INT8)
    cmds:
      - task: base

  # ── Shared utilities ────────────────────────────────────────────────────────

  check:uv:
    desc: Verify uv is installed
    internal: true
    preconditions:
      - sh: command -v uv
        msg: "uv not found. Install from: https://docs.astral.sh/uv/getting-started/installation/"

  check:maven:
    desc: Verify Maven is available
    internal: true
    preconditions:
      - sh: command -v mvn
        msg: "mvn not found. Install Maven: https://maven.apache.org/install.html"

  format:
    desc: Apply license headers and format code
    deps:
      - check:maven
    cmds:
      - mvn license:format prettier:write

  build:
    desc: Build the Java project with Maven
    deps:
      - check:maven
      - format
    cmds:
      - mvn clean install -DskipTests

  build:openvino:
    desc: 'Build the OpenVINO ONNX Runtime jar and install it locally (override OPENVINO_DEVICE=CPU|GPU|NPU)'
    cmds:
      - scripts/build_ort_openvino.sh

  test:
    desc: Run tests
    deps:
      - check:maven
      - format
    cmds:
      - mvn test

  benchmark:
    desc: Run JMH benchmarks (host JVM). Override EP=cuda|openvino|coreml (CUDA also needs MVN_FLAGS=-Pcuda)
    deps:
      - check:maven
    vars:
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn -pl gliner4j-benchmark -am package -DskipTests {{.MVN_FLAGS | default ""}}
      - java -jar gliner4j-benchmark/target/gliner4j-benchmark.jar -p executionProvider={{.EP}} {{.JMH_ARGS | default ""}}

  benchmark:cuda:
    desc: Run JMH benchmarks on the CUDA execution provider (requires an NVIDIA GPU + CUDA/cuDNN runtime)
    cmds:
      - task: benchmark
        vars: { EP: cuda, MVN_FLAGS: '-Pcuda' }

  benchmark:openvino:
    desc: Run JMH benchmarks on the OpenVINO execution provider (run build:openvino first)
    cmds:
      - task: benchmark
        vars: { EP: openvino, MVN_FLAGS: '-Popenvino' }

  benchmark:coreml:
    desc: Run JMH benchmarks on the CoreML execution provider (Apple Silicon)
    cmds:
      - task: benchmark
        vars: { EP: coreml }

  benchmark:docker:build:
    desc: Build the benchmark Docker image (`gliner4j-benchmark:latest`)
    cmds:
      - docker build -f gliner4j-benchmark/Dockerfile -t gliner4j-benchmark:latest .

  benchmark:docker:openvino:
    desc: 'Run the OpenVINO benchmark in Docker (run build:openvino on the host first; override OPENVINO_VERSION, CPUSET, RESULTS_FILE)'
    vars:
      OPENVINO_VERSION: '{{.OPENVINO_VERSION | default "2026.1.0"}}'
      CPUSET: '{{.CPUSET | default "0-3"}}'
      RESULTS_FILE: '{{.RESULTS_FILE | default "bench-openvino.json"}}'
    cmds:
      # 1. build the uber-jar on the host, against the locally-installed onnxruntime_openvino jar
      - mvn -pl gliner4j-benchmark -am package -DskipTests -Popenvino
      # 2. bake it into an Intel OpenVINO runtime image (version must match what you built against)
      - docker build -f gliner4j-benchmark/Dockerfile.openvino --build-arg OPENVINO_VERSION={{.OPENVINO_VERSION}} -t gliner4j-benchmark:openvino .
      # 3. run, selecting the OpenVINO provider
      - mkdir -p results
      - >
        docker run --rm
        --cpuset-cpus={{.CPUSET}}
        -v $PWD/models:/app/models
        -v $PWD/results:/app/results
        gliner4j-benchmark:openvino
        -p executionProvider=openvino
        -rf json -rff /app/results/{{.RESULTS_FILE}}
        {{.JMH_ARGS | default ""}}

  analyze:
    desc: Analyze JMH JSON output(s) — produces results/{summary.csv,report.md,plots/*.png}
    deps:
      - check:uv
    vars:
      INPUTS: '{{.INPUTS | default "results/bench-cpu1.json results/bench-cpu2.json results/bench-cpu4.json"}}'
      OUT: '{{.OUT | default "results"}}'
    cmds:
      - uv run scripts/analyze_benchmark.py analyze {{.INPUTS}} --out {{.OUT}}

  analyze:compare:
    desc: "Compare N labeled run sets (>= 2). Usage: task analyze:compare RUNS='baseline=path1.json tuned=path2.json,path3.json'"
    deps:
      - check:uv
    requires:
      vars:
        - RUNS
    vars:
      OUT: '{{.OUT | default "results/compare"}}'
    cmds:
      - uv run scripts/analyze_benchmark.py compare {{.RUNS}} --out {{.OUT}}

  benchmark:docker:
    desc: Run the benchmark in Docker with CPU affinity (override CPUSET, RESULTS_FILE, JMH_ARGS as needed)
    deps:
      - benchmark:docker:build
    vars:
      CPUSET: '{{.CPUSET | default "0-3"}}'
      RESULTS_FILE: '{{.RESULTS_FILE | default "bench.json"}}'
    cmds:
      - mkdir -p results
      - >
        docker run --rm
        --cpuset-cpus={{.CPUSET}}
        -v $PWD/models:/app/models
        -v $PWD/results:/app/results
        gliner4j-benchmark:latest
        -rf json -rff /app/results/{{.RESULTS_FILE}}
        {{.JMH_ARGS | default ""}}

  # ── Base model chain (fastino/gliner2-base-v1) ──────────────────────────────

  base:
    desc: Download and export the base model (FP32 + FP16 + INT8) and render its MODEL_CARD.md
    cmds:
      - task: model:download:base
      - task: model:export:base
        vars:
          EXPORT_ARGS: "--variant fp16 --variant quantized"

  model:download:base:
    desc: Download the base GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.BASE_HF_MODEL}} --local-dir {{.BASE_HF_LOCAL_DIR}}
    status:
      - test -f {{.BASE_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.BASE_HF_LOCAL_DIR}}/config.json

  model:export:base:
    desc: Export the base PyTorch model to ONNX (base + optional variants) and render its MODEL_CARD.md
    deps:
      - model:download:base
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py --model-path {{.BASE_HF_LOCAL_DIR}} --output-dir {{.BASE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py base {{.BASE_ONNX_OUTPUT_DIR}}/MODEL_CARD.md
    sources:
      - scripts/export_onnx.py
      - "{{.BASE_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/span_rep.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/scoring_head.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:base:
    desc: Remove downloaded and exported base model files
    prompt: This will delete all base model files. Continue?
    cmds:
      - rm -rf {{.BASE_HF_LOCAL_DIR}}
      - rm -rf {{.BASE_ONNX_OUTPUT_DIR}}

  demo:base:
    desc: 'Run the GLiNER4j demo against the base profile (override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="base {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:base:cuda:
    desc: 'Run the base demo on the CUDA execution provider (requires an NVIDIA GPU + CUDA/cuDNN runtime)'
    cmds:
      - task: demo:base
        vars: { EP: cuda, MVN_FLAGS: '-Pcuda', VARIANT: '{{.VARIANT | default "onnx"}}' }

  demo:base:openvino:
    desc: 'Run the base demo on the OpenVINO execution provider (run build:openvino first)'
    cmds:
      - task: demo:base
        vars: { EP: openvino, MVN_FLAGS: '-Popenvino', VARIANT: '{{.VARIANT | default "onnx"}}' }

  demo:base:coreml:
    desc: 'Run the base demo on the CoreML execution provider (Apple Silicon)'
    cmds:
      - task: demo:base
        vars: { EP: coreml, VARIANT: '{{.VARIANT | default "onnx"}}' }

  hf-upload:base:
    desc: Upload the base ONNX model directory to HuggingFace Hub
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -d {{.BASE_ONNX_OUTPUT_DIR}}/onnx
        msg: "Base ONNX model directory not found. Run: task model:export:base"
    cmds:
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.BASE_ONNX_OUTPUT_DIR}} . --commit-message "Upload base ONNX model files (all variants) + model card"

  # ── PII model chain (fastino/gliner2-privacy-filter-PII-multi) ──────────────

  pii:
    desc: Download and export the PII model (FP32 + FP16 + INT8) and render its MODEL_CARD.md
    cmds:
      - task: model:download:pii
      - task: model:export:pii
        vars:
          EXPORT_ARGS: "--variant fp16 --variant quantized"

  model:download:pii:
    desc: Download the PII GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.PII_HF_MODEL}} --local-dir {{.PII_HF_LOCAL_DIR}}
    status:
      - test -f {{.PII_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.PII_HF_LOCAL_DIR}}/config.json

  model:export:pii:
    desc: Export the PII PyTorch model to ONNX (base + optional variants) and render its MODEL_CARD.md
    deps:
      - model:download:pii
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py --model-path {{.PII_HF_LOCAL_DIR}} --output-dir {{.PII_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py pii {{.PII_ONNX_OUTPUT_DIR}}/MODEL_CARD.md
    sources:
      - scripts/export_onnx.py
      - "{{.PII_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/span_rep.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/scoring_head.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.PII_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:pii:
    desc: Remove downloaded and exported PII model files
    prompt: This will delete all PII model files. Continue?
    cmds:
      - rm -rf {{.PII_HF_LOCAL_DIR}}
      - rm -rf {{.PII_ONNX_OUTPUT_DIR}}

  demo:pii:
    desc: 'Run the GLiNER4j demo against the PII profile (42 PII labels — override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="pii {{.VARIANT}} {{.EP}}" 2>/dev/null

  hf-upload:pii:
    desc: Upload the PII ONNX model directory to HuggingFace Hub
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -d {{.PII_ONNX_OUTPUT_DIR}}/onnx
        msg: "PII ONNX model directory not found. Run: task model:export:pii"
    cmds:
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.PII_ONNX_OUTPUT_DIR}} . --commit-message "Upload PII ONNX model files (all variants) + model card"

  # ── GLiGuard model chain (fastino/gliguard-LLMGuardrails-300M) ──────────────

  gliguard:
    desc: Download and export the GLiGuard model (FP32 + FP16 + INT8) and render its MODEL_CARD.md
    cmds:
      - task: model:download:gliguard
      - task: model:export:gliguard
        vars:
          EXPORT_ARGS: "--variant fp16 --variant quantized"

  model:download:gliguard:
    desc: Download the GLiGuard GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.GLIGUARD_HF_MODEL}} --local-dir {{.GLIGUARD_HF_LOCAL_DIR}}
    status:
      - test -f {{.GLIGUARD_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.GLIGUARD_HF_LOCAL_DIR}}/config.json

  model:export:gliguard:
    desc: Export the GLiGuard PyTorch model to ONNX (base + optional variants) and render its MODEL_CARD.md
    deps:
      - model:download:gliguard
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py --model-path {{.GLIGUARD_HF_LOCAL_DIR}} --output-dir {{.GLIGUARD_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py gliguard {{.GLIGUARD_ONNX_OUTPUT_DIR}}/MODEL_CARD.md
    sources:
      - scripts/export_onnx.py
      - "{{.GLIGUARD_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/onnx/classifier_head.onnx"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:gliguard:
    desc: Remove downloaded and exported GLiGuard model files
    prompt: This will delete all GLiGuard model files. Continue?
    cmds:
      - rm -rf {{.GLIGUARD_HF_LOCAL_DIR}}
      - rm -rf {{.GLIGUARD_ONNX_OUTPUT_DIR}}

  demo:gliguard:
    desc: 'Run the GLiNER4j demo against the GLiGuard profile (LLM guardrail classification — override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliguard {{.VARIANT}} {{.EP}}" 2>/dev/null

  hf-upload:gliguard:
    desc: Upload the GLiGuard ONNX model directory to HuggingFace Hub
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -d {{.GLIGUARD_ONNX_OUTPUT_DIR}}/onnx
        msg: "GLiGuard ONNX model directory not found. Run: task model:export:gliguard"
    cmds:
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.GLIGUARD_ONNX_OUTPUT_DIR}} . --commit-message "Upload GLiGuard ONNX model files (all variants) + model card"

  # ── GLiClass model chain (knowledgator/gliclass-modern-base-v3.0) ───────────

  gliclass:
    desc: Export the GLiClass model to ONNX (encoder + score_head; FP32 + FP16 + INT8; verified vs PyTorch). Downloads the model from HuggingFace on first run.
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliclass_onnx.py --model-path {{.GLICLASS_HF_MODEL}} --output-dir {{.GLICLASS_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliclass_onnx.py
    generates:
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx/score_head.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx_quantized/encoder.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:gliclass:
    desc: Remove exported GLiClass model files
    prompt: This will delete all GLiClass model files. Continue?
    cmds:
      - rm -rf {{.GLICLASS_ONNX_OUTPUT_DIR}}

  demo:gliclass:
    desc: 'Run the GLiNER4j demo against the GLiClass zero-shot topic-classification profile (override VARIANT=onnx, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-sentiment:
    desc: 'Run the GLiNER4j demo against the GLiClass zero-shot sentiment/emotion profile (same model, different labels)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_sentiment {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── GLiClass V3 config-swap variants (no Java changes — same engine, export & load) ─────────
  # Builds FP32 + FP16 + INT8 (QInt8) like `task gliclass`; override EXPORT_ARGS to change variants.

  gliclass:x:
    desc: "Export GLiClass-X (multilingual, mdeberta-v3-base) — zero-shot classification across 20+ languages"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliclass_onnx.py --model-path {{.GLICLASS_X_HF_MODEL}} --output-dir {{.GLICLASS_X_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliclass_onnx.py
    generates:
      - "{{.GLICLASS_X_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:modern-large:
    desc: "Export GLiClass modern-large v3 (ModernBERT-large) — highest-accuracy zero-shot classifier"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliclass_onnx.py --model-path {{.GLICLASS_MODERN_LARGE_HF_MODEL}} --output-dir {{.GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliclass_onnx.py
    generates:
      - "{{.GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:large:
    desc: "Export GLiClass large v3 (deberta-v3-large, mlp scorer)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliclass_onnx.py --model-path {{.GLICLASS_LARGE_HF_MODEL}} --output-dir {{.GLICLASS_LARGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliclass_onnx.py
    generates:
      - "{{.GLICLASS_LARGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:edge:
    desc: "Export GLiClass edge v3 (ettin-32m, tiny/fast)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliclass_onnx.py --model-path {{.GLICLASS_EDGE_HF_MODEL}} --output-dir {{.GLICLASS_EDGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliclass_onnx.py
    generates:
      - "{{.GLICLASS_EDGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  demo:gliclass-multilang:
    desc: "Run the demo: GLiClass-X multilingual zero-shot topic classification (needs: task gliclass:x)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_multilang {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-edge:
    desc: "Run the demo: GLiClass edge zero-shot intent classification (tiny/fast; needs: task gliclass:edge)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_edge {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── GLiNER NER families (uni/bi-encoder span — export & load) ────────────────
  # Builds FP32 + FP16 + INT8 (QInt8); all DeBERTa-patched (0 If nodes) + name-sanitized (OpenVINO-ready).

  gliner-pii:
    desc: "Export GLiNER-PII (uni-encoder, deberta-v3-small) — zero-shot PII NER (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliner_uni_onnx.py --model-path {{.GLINER_PII_HF_MODEL}} --output-dir {{.GLINER_PII_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliner_uni_onnx.py
    generates:
      - "{{.GLINER_PII_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  gliner-bi:
    desc: "Export GLiNER bi-encoder (deberta text + MiniLM label) — zero-shot NER (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_gliner_uni_onnx.py --model-path {{.GLINER_BI_HF_MODEL}} --output-dir {{.GLINER_BI_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_gliner_uni_onnx.py
    generates:
      - "{{.GLINER_BI_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  demo:gliner-pii:
    desc: "Run the demo: GLiNER-PII zero-shot PII NER (uni-encoder; needs: task gliner-pii)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_pii {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliner-bi:
    desc: "Run the demo: GLiNER bi-encoder zero-shot NER (dual encoder; needs: task gliner-bi)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_bi {{.VARIANT}} {{.EP}}" 2>/dev/null
