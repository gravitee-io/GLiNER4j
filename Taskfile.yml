      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.GLINER2DOT5_MULTI_ONNX_OUTPUT_DIR}} . --delete "*" --exclude "onnx_*optimized*/*" --commit-message "Upload GLiNER2.5 multilingual bundle (all variants) + model card"

  hf-upload:scx-router:
    desc: "Mirror the SCX router (llama.cpp) bundle to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally, skips local optimized-graph caches)"
    requires:
