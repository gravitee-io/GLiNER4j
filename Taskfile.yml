# https://taskfile.dev
version: "3"

vars:
  # Base model (fastino/gliner2-base-v1)
  BASE_HF_MODEL: "fastino/gliner2-base-v1"
  BASE_HF_LOCAL_DIR: "models/gliner2-base-hf"
  BASE_ONNX_OUTPUT_DIR: "models/gliner2-base-onnx"

  # PII model (fastino/gliner2-privacy-filter-PII-multi)
  PII_HF_MODEL: "fastino/gliner2-privacy-filter-PII-multi"
  PII_HF_LOCAL_DIR: "models/gliner2-privacy-hf"
  PII_ONNX_OUTPUT_DIR: "models/gliner2-privacy-onnx"

  # GLiGuard model (fastino/gliguard-LLMGuardrails-300M)
  GLIGUARD_HF_MODEL: "fastino/gliguard-LLMGuardrails-300M"
  GLIGUARD_HF_LOCAL_DIR: "models/gliguard-hf"
  GLIGUARD_ONNX_OUTPUT_DIR: "models/gliguard-onnx"

  # GLiNER2.5 models (fastino boundary architecture — span-free NER + classification)
  GLINER2DOT5_HF_MODEL: "fastino/gliner2.5-base-v1" # deberta-v3-base, English
  GLINER2DOT5_ONNX_OUTPUT_DIR: "models/gliner2dot5-base-onnx"
  GLINER2DOT5_SMALL_HF_MODEL: "fastino/gliner2.5-small-v1" # deberta-v3-xsmall, English
  GLINER2DOT5_SMALL_ONNX_OUTPUT_DIR: "models/gliner2dot5-small-onnx"
  GLINER2DOT5_MULTI_HF_MODEL: "fastino/gliner2.5-multi-v1" # mdeberta-v3-base, multilingual
  GLINER2DOT5_MULTI_ONNX_OUTPUT_DIR: "models/gliner2dot5-multi-onnx"

  # GLiClass decoder-kv router (scx-admin/scx-router-v0.1 — Qwen3-0.6B on llama.cpp + ONNX scorer)
  SCX_ROUTER_HF_MODEL: "scx-admin/scx-router-v0.1"
  SCX_ROUTER_HF_LOCAL_DIR: "models/scx-router-hf"
  SCX_ROUTER_OUTPUT_DIR: "models/scx-router-onnx"
  LLAMA_CPP_DIR: '{{.LLAMA_CPP_DIR | default "../llama.cpp"}}' # checkout at llamaj.cpp's pinned llama.cpp tag (2.8.0 → v0.4.0 = b10818)

  # GLiNER streaming-span PII (knowledgator/gliner-stream-pii-v1.0 — Qwen3-0.6B on llama.cpp + ggml span head)
  STREAM_PII_HF_MODEL: "knowledgator/gliner-stream-pii-v1.0"
  STREAM_PII_HF_LOCAL_DIR: "models/gliner-stream-pii-hf"
  STREAM_PII_OUTPUT_DIR: "models/gliner-stream-pii-onnx"

  # GLiClass model (knowledgator/gliclass-modern-base-v3.0 — ModernBERT zero-shot classification)
  GLICLASS_HF_MODEL: "knowledgator/gliclass-modern-base-v3.0"
  GLICLASS_ONNX_OUTPUT_DIR: "models/gliclass-modern-base-onnx"

  # GLiClass V3 config-swap variants (same uni-encoder + score-head pipeline — export & load, no code)
  GLICLASS_X_HF_MODEL: "knowledgator/gliclass-x-base" # multilingual (mdeberta-v3-base)
  GLICLASS_X_ONNX_OUTPUT_DIR: "models/gliclass-x-onnx"
  GLICLASS_MODERN_LARGE_HF_MODEL: "knowledgator/gliclass-modern-large-v3.0"
  GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR: "models/gliclass-modern-large-onnx"
  GLICLASS_LARGE_HF_MODEL: "knowledgator/gliclass-large-v3.0"
  GLICLASS_LARGE_ONNX_OUTPUT_DIR: "models/gliclass-large-onnx"
  GLICLASS_EDGE_HF_MODEL: "knowledgator/gliclass-edge-v3.0"
  GLICLASS_EDGE_ONNX_OUTPUT_DIR: "models/gliclass-edge-onnx"
  GLICLASS_EDGE_LLAMACPP_OUTPUT_DIR: "models/gliclass-edge-llamacpp"

  # GLiNER NER families (original-GLiNER uni/bi-encoder span models — zero-shot NER)
  GLINER_PII_HF_MODEL: "knowledgator/gliner-pii-base-v1.0" # uni-encoder, deberta-v3-small
  GLINER_PII_ONNX_OUTPUT_DIR: "models/gliner-pii-base-onnx"
  GLINER_BI_HF_MODEL: "knowledgator/gliner-bi-small-v1.0" # bi-encoder, deberta + MiniLM
  GLINER_BI_ONNX_OUTPUT_DIR: "models/gliner-bi-small-onnx"
  # GLiNER-X (mT5 multilingual NER). Trained with stanza word-splitting; we force whitespace
  # (see TODO in export script + GlinerUniNerStrategy) — EU/space-separated languages only, no CJK.
  GLINER_X_HF_MODEL: "knowledgator/gliner-x-base"
  GLINER_X_ONNX_OUTPUT_DIR: "models/gliner-x-base-onnx"
  GLINER_MULTITASK_HF_MODEL: "knowledgator/gliner-multitask-large-v0.5" # token_level, deberta-v3-large
  GLINER_MULTITASK_ONNX_OUTPUT_DIR: "models/gliner-multitask-large-onnx"

tasks:
  default:
    desc: Default — runs the base all-in-one chain (download + export, FP16 + INT8)
    cmds:
      - task: base

  # ── Shared utilities ────────────────────────────────────────────────────────

  check:uv:
    desc: Verify uv is installed
    internal: true
    preconditions:
      - sh: command -v uv
        msg: "uv not found. Install from: https://docs.astral.sh/uv/getting-started/installation/"

  check:maven:
    desc: Verify Maven is available
    internal: true
    preconditions:
      - sh: command -v mvn
        msg: "mvn not found. Install Maven: https://maven.apache.org/install.html"

  format:
    desc: Apply license headers and format code
    deps:
      - check:maven
    cmds:
      - mvn license:format prettier:write

  build:
    desc: Build the Java project with Maven
    deps:
      - check:maven
      - format
    cmds:
      - mvn clean install -DskipTests

  build:openvino:
    desc: 'Build the OpenVINO ONNX Runtime jar and install it locally (override OPENVINO_DEVICE=CPU|GPU|NPU)'
    cmds:
      - scripts/build_ort_openvino.sh

  test:
    desc: Run tests
    deps:
      - check:maven
      - format
    cmds:
      - mvn test

  benchmark:
    desc: Run JMH benchmarks (host JVM). Override EP=cuda|openvino|coreml (CUDA also needs MVN_FLAGS=-Pcuda)
    deps:
      - check:maven
    vars:
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn -pl gliner4j-benchmark -am package -DskipTests {{.MVN_FLAGS | default ""}}
      - java -jar gliner4j-benchmark/target/gliner4j-benchmark.jar -p executionProvider={{.EP}} {{.JMH_ARGS | default ""}}

  benchmark:engines:
    desc: 'ONNX Runtime vs llama.cpp on the same family (default: GLiClass edge classification), CPU and auto (Metal/CUDA). Override PROFILE, BENCH, JMH_ARGS'
    deps:
      - check:maven
    vars:
      PROFILE: '{{.PROFILE | default "gliclass-edge"}}'
      BENCH: '{{.BENCH | default "ClassificationBenchmark"}}'
    cmds:
      - mvn -pl gliner4j-benchmark -am package -DskipTests {{.MVN_FLAGS | default ""}}
      - java --enable-native-access=ALL-UNNAMED -jar gliner4j-benchmark/target/gliner4j-benchmark.jar {{.BENCH}} -p profile={{.PROFILE}} -p engine=onnx -p variant=onnx_quantized -p executionProvider=cpu -p batchSize=1,8 -p textLength=short,long {{.JMH_ARGS | default "-wi 2 -i 5 -f 1"}}
      - java --enable-native-access=ALL-UNNAMED -jar gliner4j-benchmark/target/gliner4j-benchmark.jar {{.BENCH}} -p profile={{.PROFILE}} -p engine=llamacpp -p variant=q8_0 -p executionProvider=cpu,auto -p batchSize=1,8 -p textLength=short,long {{.JMH_ARGS | default "-wi 2 -i 5 -f 1"}}

  benchmark:cuda:
    desc: Run JMH benchmarks on the CUDA execution provider (sources scripts/cuda_env.sh on first run; requires an NVIDIA GPU)
    deps:
      - check:maven
    cmds:
      - mvn -pl gliner4j-benchmark -am package -DskipTests -Pcuda
      - source scripts/cuda_env.sh && java -jar gliner4j-benchmark/target/gliner4j-benchmark.jar -p executionProvider=cuda {{.JMH_ARGS | default ""}}

  benchmark:openvino:
    desc: Run JMH benchmarks on the OpenVINO execution provider (run build:openvino first)
    cmds:
      - task: benchmark
        vars: { EP: openvino, MVN_FLAGS: '-Popenvino' }

  benchmark:coreml:
    desc: Run JMH benchmarks on the CoreML execution provider (Apple Silicon)
    cmds:
      - task: benchmark
        vars: { EP: coreml }

  benchmark:docker:build:
    desc: Build the benchmark Docker image (`gliner4j-benchmark:latest`)
    cmds:
      - docker build -f gliner4j-benchmark/Dockerfile -t gliner4j-benchmark:latest .

  benchmark:docker:openvino:
    desc: 'Run the OpenVINO benchmark in Docker (run build:openvino on the host first; override OPENVINO_VERSION, CPUSET, RESULTS_FILE)'
    vars:
      OPENVINO_VERSION: '{{.OPENVINO_VERSION | default "2026.1.0"}}'
      CPUSET: '{{.CPUSET | default "0-3"}}'
      RESULTS_FILE: '{{.RESULTS_FILE | default "bench-openvino.json"}}'
    cmds:
      # 1. build the uber-jar on the host, against the locally-installed onnxruntime_openvino jar
      - mvn -pl gliner4j-benchmark -am package -DskipTests -Popenvino
      # 2. bake it into an Intel OpenVINO runtime image (version must match what you built against)
      - docker build -f gliner4j-benchmark/Dockerfile.openvino --build-arg OPENVINO_VERSION={{.OPENVINO_VERSION}} -t gliner4j-benchmark:openvino .
      # 3. run, selecting the OpenVINO provider
      - mkdir -p results
      - >
        docker run --rm
        --cpuset-cpus={{.CPUSET}}
        -v $PWD/models:/app/models
        -v $PWD/results:/app/results
        gliner4j-benchmark:openvino
        -p executionProvider=openvino
        -rf json -rff /app/results/{{.RESULTS_FILE}}
        {{.JMH_ARGS | default ""}}

  analyze:
    desc: Analyze JMH JSON output(s) — produces results/{summary.csv,report.md,plots/*.png}
    deps:
      - check:uv
    vars:
      INPUTS: '{{.INPUTS | default "results/bench-cpu1.json results/bench-cpu2.json results/bench-cpu4.json"}}'
      OUT: '{{.OUT | default "results"}}'
    cmds:
      - uv run scripts/analyze_benchmark.py analyze {{.INPUTS}} --out {{.OUT}}

  analyze:compare:
    desc: "Compare N labeled run sets (>= 2). Usage: task analyze:compare RUNS='baseline=path1.json tuned=path2.json,path3.json'"
    deps:
      - check:uv
    requires:
      vars:
        - RUNS
    vars:
      OUT: '{{.OUT | default "results/compare"}}'
    cmds:
      - uv run scripts/analyze_benchmark.py compare {{.RUNS}} --out {{.OUT}}

  benchmark:docker:
    desc: Run the benchmark in Docker with CPU affinity (override CPUSET, RESULTS_FILE, JMH_ARGS as needed)
    deps:
      - benchmark:docker:build
    vars:
      CPUSET: '{{.CPUSET | default "0-3"}}'
      RESULTS_FILE: '{{.RESULTS_FILE | default "bench.json"}}'
    cmds:
      - mkdir -p results
      - >
        docker run --rm
        --cpuset-cpus={{.CPUSET}}
        -v $PWD/models:/app/models
        -v $PWD/results:/app/results
        gliner4j-benchmark:latest
        -rf json -rff /app/results/{{.RESULTS_FILE}}
        {{.JMH_ARGS | default ""}}

  # ── Base model chain (fastino/gliner2-base-v1) ──────────────────────────────

  base:
    desc: Download, export, optimize the encoder and build the merged graphs for the base model
    cmds:
      - task: model:download:base
      - task: model:export:base
        vars:
          # --no-prune-split: model:merged:base still needs the split heads for encoder fusion;
          # it removes them itself once ner_full/classifier_full are rebuilt and verified.
          EXPORT_ARGS: "--variant fp16 --variant quantized --no-prune-split"
      - task: model:merged:base

  model:merged:base:
    desc: Optimize the encoder (fused) and rebuild ner_full + classifier_full from the heads (fp32 + fp16)
    deps:
      - check:uv
    cmds:
      - uv run scripts/build_merged_graphs.py optimize-encoder {{.BASE_ONNX_OUTPUT_DIR}} onnx --fp16-from-fp32
      - uv run scripts/build_merged_graphs.py rebuild {{.BASE_ONNX_OUTPUT_DIR}}
      - uv run scripts/build_merged_graphs.py verify {{.BASE_ONNX_OUTPUT_DIR}} onnx
      # The split heads are intermediates: fused into ner_full/classifier_full above, verified,
      # then dropped so the bundle only ships the final graphs.
      - rm -f {{.BASE_ONNX_OUTPUT_DIR}}/{onnx,onnx_fp16,onnx_quantized}/{encoder,span_rep,scoring_head,classifier_head}.onnx
    sources:
      - scripts/build_merged_graphs.py
    generates:
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx_fp16/ner_full.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx_fp16/classifier_full.onnx"

  model:download:base:
    desc: Download the base GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.BASE_HF_MODEL}} --local-dir {{.BASE_HF_LOCAL_DIR}}
    status:
      - test -f {{.BASE_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.BASE_HF_LOCAL_DIR}}/config.json

  model:export:base:
    desc: Export the base PyTorch model to ONNX (base + optional variants) and render its README.md
    deps:
      - model:download:base
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2 --model-path {{.BASE_HF_LOCAL_DIR}} --output-dir {{.BASE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py base {{.BASE_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
      - "{{.BASE_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.BASE_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:base:
    desc: Remove downloaded and exported base model files
    prompt: This will delete all base model files. Continue?
    cmds:
      - rm -rf {{.BASE_HF_LOCAL_DIR}}
      - rm -rf {{.BASE_ONNX_OUTPUT_DIR}}

  demo:base:
    desc: 'Run the GLiNER4j demo against the base profile (override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="base {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:llamacpp:
    desc: 'Run a demo profile on its llama.cpp / ggml bundle (PROFILE=base|pii|gliguard|gliner2dot5-small|gliclass-edge|gliner-pii|gliner-bi|gliner-multitask; VARIANT=f16|q8_0; EP=auto|cpu)'
    deps:
      - check:maven
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "auto"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="{{.PROFILE | replace "-" "_"}}_llamacpp {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:base:llamacpp:
    desc: 'Run the base (GLiNER2) demo on the llama.cpp / ggml engine (Metal/CUDA when available)'
    cmds:
      - task: demo:llamacpp
        vars: { PROFILE: base }

  demo:base:cuda:
    desc: 'Run the base demo on the CUDA execution provider (sources scripts/cuda_env.sh on first run; requires an NVIDIA GPU)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
    cmds:
      - source scripts/cuda_env.sh && mvn exec:java -pl gliner4j-demo -Pcuda -Dexec.args="base {{.VARIANT}} cuda"

  demo:base:openvino:
    desc: 'Run the base demo on the OpenVINO execution provider (run build:openvino first)'
    cmds:
      - task: demo:base
        vars: { EP: openvino, MVN_FLAGS: '-Popenvino', VARIANT: '{{.VARIANT | default "onnx"}}' }

  demo:base:coreml:
    desc: 'Run the base demo on the CoreML execution provider (Apple Silicon)'
    cmds:
      - task: demo:base
        vars: { EP: coreml, VARIANT: '{{.VARIANT | default "onnx"}}' }

  hf-upload:base:
    desc: Mirror the base ONNX model directory to HuggingFace Hub (deletes remote files not present locally)
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -d {{.BASE_ONNX_OUTPUT_DIR}}/onnx
        msg: "Base ONNX model directory not found. Run: task model:export:base"
    cmds:
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.BASE_ONNX_OUTPUT_DIR}} . --delete "*" --commit-message "Upload base ONNX model files (all variants) + model card"

  # ── PII model chain (fastino/gliner2-privacy-filter-PII-multi) ──────────────

  pii:
    desc: Download, export, optimize the encoder and build the merged graphs for the PII model
    cmds:
      - task: model:download:pii
      - task: model:export:pii
        vars:
          # --no-prune-split: model:merged:pii still needs the split heads for encoder fusion;
          # it removes them itself once ner_full/classifier_full are rebuilt and verified.
          EXPORT_ARGS: "--variant fp16 --variant quantized --no-prune-split"
      - task: model:merged:pii

  model:merged:pii:
    desc: Optimize the encoder (fused) and rebuild ner_full + classifier_full from the heads (fp32 + fp16)
    deps:
      - check:uv
    cmds:
      - uv run scripts/build_merged_graphs.py optimize-encoder {{.PII_ONNX_OUTPUT_DIR}} onnx --fp16-from-fp32
      - uv run scripts/build_merged_graphs.py rebuild {{.PII_ONNX_OUTPUT_DIR}}
      - uv run scripts/build_merged_graphs.py verify {{.PII_ONNX_OUTPUT_DIR}} onnx
      # The split heads are intermediates: fused into ner_full/classifier_full above, verified,
      # then dropped so the bundle only ships the final graphs.
      - rm -f {{.PII_ONNX_OUTPUT_DIR}}/{onnx,onnx_fp16,onnx_quantized}/{encoder,span_rep,scoring_head,classifier_head}.onnx
    sources:
      - scripts/build_merged_graphs.py
    generates:
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx_fp16/ner_full.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx_fp16/classifier_full.onnx"

  model:download:pii:
    desc: Download the PII GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.PII_HF_MODEL}} --local-dir {{.PII_HF_LOCAL_DIR}}
    status:
      - test -f {{.PII_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.PII_HF_LOCAL_DIR}}/config.json

  model:export:pii:
    desc: Export the PII PyTorch model to ONNX (base + optional variants) and render its README.md
    deps:
      - model:download:pii
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2 --model-path {{.PII_HF_LOCAL_DIR}} --output-dir {{.PII_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py pii {{.PII_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
      - "{{.PII_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"
      - "{{.PII_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.PII_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:pii:
    desc: Remove downloaded and exported PII model files
    prompt: This will delete all PII model files. Continue?
    cmds:
      - rm -rf {{.PII_HF_LOCAL_DIR}}
      - rm -rf {{.PII_ONNX_OUTPUT_DIR}}

  demo:pii:
    desc: 'Run the GLiNER4j demo against the PII profile (42 PII labels — override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="pii {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:pii:cuda:
    desc: 'Run the PII demo on the CUDA execution provider (sources scripts/cuda_env.sh on first run; requires an NVIDIA GPU)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
    cmds:
      - source scripts/cuda_env.sh && mvn exec:java -pl gliner4j-demo -Pcuda -Dexec.args="pii {{.VARIANT}} cuda"

  demo:pii:openvino:
    desc: 'Run the PII demo on the OpenVINO execution provider (run build:openvino first)'
    cmds:
      - task: demo:pii
        vars: { EP: openvino, MVN_FLAGS: '-Popenvino', VARIANT: '{{.VARIANT | default "onnx"}}' }

  demo:pii:coreml:
    desc: 'Run the PII demo on the CoreML execution provider (Apple Silicon)'
    cmds:
      - task: demo:pii
        vars: { EP: coreml, VARIANT: '{{.VARIANT | default "onnx"}}' }

  hf-upload:pii:
    desc: Mirror the PII ONNX model directory to HuggingFace Hub (deletes remote files not present locally)
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -d {{.PII_ONNX_OUTPUT_DIR}}/onnx
        msg: "PII ONNX model directory not found. Run: task model:export:pii"
    cmds:
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.PII_ONNX_OUTPUT_DIR}} . --delete "*" --commit-message "Upload PII ONNX model files (all variants) + model card"

  # ── GLiGuard model chain (fastino/gliguard-LLMGuardrails-300M) ──────────────

  gliguard:
    desc: Download and export the GLiGuard model (FP32 + FP16 + INT8) and render its README.md
    cmds:
      - task: model:download:gliguard
      - task: model:export:gliguard
        vars:
          EXPORT_ARGS: "--variant fp16 --variant quantized"

  model:download:gliguard:
    desc: Download the GLiGuard GLiNER2 model from HuggingFace
    deps:
      - check:uv
    cmds:
      - uvx --from huggingface-hub hf download {{.GLIGUARD_HF_MODEL}} --local-dir {{.GLIGUARD_HF_LOCAL_DIR}}
    status:
      - test -f {{.GLIGUARD_HF_LOCAL_DIR}}/model.safetensors
      - test -f {{.GLIGUARD_HF_LOCAL_DIR}}/config.json

  model:export:gliguard:
    desc: Export the GLiGuard PyTorch model to ONNX (base + optional variants) and render its README.md
    deps:
      - model:download:gliguard
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2 --model-path {{.GLIGUARD_HF_LOCAL_DIR}} --output-dir {{.GLIGUARD_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py gliguard {{.GLIGUARD_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
      - "{{.GLIGUARD_HF_LOCAL_DIR}}/**/*"
    generates:
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.GLIGUARD_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:gliguard:
    desc: Remove downloaded and exported GLiGuard model files
    prompt: This will delete all GLiGuard model files. Continue?
    cmds:
      - rm -rf {{.GLIGUARD_HF_LOCAL_DIR}}
      - rm -rf {{.GLIGUARD_ONNX_OUTPUT_DIR}}

  demo:gliguard:
    desc: 'Run the GLiNER4j demo against the GLiGuard profile (LLM guardrail classification — override VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliguard {{.VARIANT}} {{.EP}}" 2>/dev/null

  hf-upload:gliguard:
    desc: Mirror the GLiGuard ONNX model directory to HuggingFace Hub (deletes remote files not present locally)
    requires:
