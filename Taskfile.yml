      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.SCX_ROUTER_OUTPUT_DIR}} . --delete "*" --exclude "onnx_*optimized*/*" --commit-message "Upload SCX router (llama.cpp) bundle (all variants) + model card"

  hf-upload:gliclass-edge:llamacpp:
    desc: "Mirror the gliclass-edge llama.cpp/ggml bundle (models/gliclass-edge-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
