    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner2-privacy-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner2-privacy-llamacpp not found. Run: task pii:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-pii models/gliner2-privacy-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner2-privacy-llamacpp . --delete "*" --commit-message "Upload pii ggml bundle (engine=llamacpp) + model card"

  hf-upload:gliguard:llamacpp:
    desc: "Mirror the gliguard llama.cpp/ggml bundle (models/gliguard-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliguard-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliguard-llamacpp not found. Run: task gliguard:llamacpp"
    cmds:
      - uv run scripts/render_model_card.py ggml-gliguard models/gliguard-llamacpp/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliguard-llamacpp . --delete "*" --commit-message "Upload gliguard ggml bundle (engine=llamacpp) + model card"

  hf-upload:gliner2dot5-small:llamacpp:
    desc: "Mirror the gliner2dot5-small llama.cpp/ggml bundle (models/gliner2dot5-small-llamacpp) to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f models/gliner2dot5-small-llamacpp/gguf/model.gguf
        msg: "ggml bundle models/gliner2dot5-small-llamacpp not found. Run: task gliner2dot5-small:llamacpp"
    cmds:
