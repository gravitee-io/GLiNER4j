      - uvx --from huggingface-hub hf upload {{.HF_REPO}} models/gliner2dot5-small-llamacpp . --delete "*" --commit-message "Upload gliner2dot5-small ggml bundle (engine=llamacpp) + model card"

  hf-upload:stream-pii:
    desc: "Mirror the GLiNER Stream PII (llama.cpp) bundle to HuggingFace Hub (HF_REPO=<org>/<repo>; deletes remote files not present locally, skips local optimized-graph caches)"
    requires:
      vars:
        - HF_REPO
    deps:
      - check:uv
    preconditions:
      - sh: test -f {{.STREAM_PII_OUTPUT_DIR}}/gguf/backbone-q8_0.gguf
        msg: "GLiNER Stream PII (llama.cpp) bundle not found. Run: task stream-pii"
    cmds:
      - uv run scripts/render_model_card.py stream-pii {{.STREAM_PII_OUTPUT_DIR}}/README.md
      - uvx --from huggingface-hub hf upload {{.HF_REPO}} {{.STREAM_PII_OUTPUT_DIR}} . --delete "*" --exclude "onnx_*optimized*/*" --commit-message "Upload GLiNER Stream PII (llama.cpp) bundle (all variants) + model card"

  # ── llama.cpp engine bundles (engine=llamacpp) ─────────────────────────────
  # Same families as the ONNX bundles, running on llamaj.cpp: encoder as GGUF (converted by
  # llama.cpp's convert_hf_to_gguf.py from LLAMA_CPP_DIR) + task heads as ggml graphs.

  gliclass-edge:llamacpp:
    desc: Export knowledgator/gliclass-edge-v3.0 for the llama.cpp engine (GGUF f16 + q8_0 encoder, heads.gguf, reference.json)
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp.py gliclass --model-path {{.GLICLASS_EDGE_HF_MODEL}} --output-dir {{.GLICLASS_EDGE_LLAMACPP_OUTPUT_DIR}} --llama-cpp-dir {{.LLAMA_CPP_DIR}} {{.EXPORT_ARGS | default ""}}
    sources:
      - scripts/export_llamacpp.py
    generates:
      - "{{.GLICLASS_EDGE_LLAMACPP_OUTPUT_DIR}}/gguf/backbone-q8_0.gguf"
      - "{{.GLICLASS_EDGE_LLAMACPP_OUTPUT_DIR}}/gguf/heads.gguf"
      - "{{.GLICLASS_EDGE_LLAMACPP_OUTPUT_DIR}}/gliner4j_config.json"

  gliner-pii:llamacpp:
    desc: Export knowledgator/gliner-pii-base-v1.0 for the ggml engine (DeBERTa encoder + markerV0 heads in one model.gguf, reference.json)
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp.py gliner-uni --model-path {{.GLINER_PII_HF_MODEL}} --output-dir {{.GLINER_PII_LLAMACPP_OUTPUT_DIR}} {{.EXPORT_ARGS | default ""}}
    sources:
      - scripts/export_llamacpp.py
    generates:
      - "{{.GLINER_PII_LLAMACPP_OUTPUT_DIR}}/gguf/model.gguf"
      - "{{.GLINER_PII_LLAMACPP_OUTPUT_DIR}}/gliner4j_config.json"

  base:llamacpp:
    desc: Export fastino/gliner2-base-v1 for the ggml engine (DeBERTa encoder + GLiNER2 heads in one model.gguf)
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp_gliner2.py --model-path {{.GLINER2_BASE_HF_LOCAL_DIR | default "models/gliner2-base-hf"}} --output-dir models/gliner2-base-llamacpp {{.EXPORT_ARGS | default ""}}
    sources:
      - scripts/export_llamacpp_gliner2.py
      - scripts/export_llamacpp.py
    generates:
      - models/gliner2-base-llamacpp/gguf/model.gguf

  pii:llamacpp:
    desc: Export fastino/gliner2-privacy-filter-PII-multi for the ggml engine
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp_gliner2.py --model-path models/gliner2-privacy-hf --output-dir models/gliner2-privacy-llamacpp {{.EXPORT_ARGS | default ""}}
    generates:
      - models/gliner2-privacy-llamacpp/gguf/model.gguf

  gliguard:llamacpp:
    desc: Export the gliguard GLiNER2 checkpoint for the ggml engine
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp_gliner2.py --model-path models/gliguard-hf --output-dir models/gliguard-llamacpp {{.EXPORT_ARGS | default ""}}
    generates:
      - models/gliguard-llamacpp/gguf/model.gguf

  gliner2dot5-small:llamacpp:
    desc: Export fastino/gliner2.5-small for the ggml engine (DeBERTa encoder + boundary / pool / scorer / relation / classifier heads in one model.gguf)
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp_gliner2.py gliner2dot5 --model-path models/gliner2dot5-small-hf --output-dir models/gliner2dot5-small-llamacpp {{.EXPORT_ARGS | default ""}}
    generates:
      - models/gliner2dot5-small-llamacpp/gguf/model.gguf

  gliner-bi:llamacpp:
    desc: Export knowledgator/gliner-bi-small-v1.0 for the ggml engine (DeBERTa text model in model.gguf + MiniLM label encoder as llama.cpp GGUF)
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp.py gliner-bi --model-path {{.GLINER_BI_HF_MODEL}} --output-dir models/gliner-bi-small-llamacpp --llama-cpp-dir {{.LLAMA_CPP_DIR}} {{.EXPORT_ARGS | default ""}}
    generates:
      - models/gliner-bi-small-llamacpp/gguf/model.gguf

  gliner-multitask:llamacpp:
    desc: Export knowledgator/gliner-multitask-large-v0.5 (token_level, deberta-v3-large) for the ggml engine
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_llamacpp.py gliner-uni --model-path {{.GLINER_MULTITASK_HF_MODEL}} --output-dir models/gliner-multitask-large-llamacpp {{.EXPORT_ARGS | default ""}}
    generates:
      - models/gliner-multitask-large-llamacpp/gguf/model.gguf

  llamacpp:natives:
    desc: 'Install the llama.cpp native libraries llamaj.cpp 2.8.0 expects into ~/.llama.cpp (they are no longer inside the jar). Override LLAMA_CPP_NATIVE_VERSION, LLAMAJ_CPP_DIR'
    vars:
      LLAMA_CPP_NATIVE_VERSION: '{{.LLAMA_CPP_NATIVE_VERSION | default "v0.4.0"}}'
      LLAMAJ_CPP_DIR: '{{.LLAMAJ_CPP_DIR | default "../llamaj.cpp"}}'
      OS: '{{if eq OS "darwin"}}macosx{{else}}linux{{end}}'
      PLATFORM: '{{if eq ARCH "arm64"}}aarch64{{else}}x86_64{{end}}'
    cmds:
      - test -f {{.LLAMAJ_CPP_DIR}}/scripts/download-native-libraries.sh || (echo "clone https://github.com/gravitee-io/llamaj.cpp next to this repo or set LLAMAJ_CPP_DIR" && exit 1)
      - rm -rf /tmp/gliner4j-natives && bash {{.LLAMAJ_CPP_DIR}}/scripts/download-native-libraries.sh -o {{.OS}} -p {{.PLATFORM}} -v {{.LLAMA_CPP_NATIVE_VERSION}} -d /tmp/gliner4j-natives
      - mkdir -p ~/.llama.cpp && rm -f ~/.llama.cpp/lib* && cp -a /tmp/gliner4j-natives/{{.OS}}/{{.PLATFORM}}/. ~/.llama.cpp/ && echo {{.LLAMA_CPP_NATIVE_VERSION}} > ~/.llama.cpp/.llama-cpp-version
      - ls ~/.llama.cpp

  llamacpp:all:
    desc: Export every llama.cpp / ggml engine bundle (needs the *-hf checkouts of the fastino models and a llama.cpp checkout)
    cmds:
      - task: gliclass-edge:llamacpp
      - task: gliner-pii:llamacpp
      - task: gliner-bi:llamacpp
      - task: gliner-multitask:llamacpp
      - task: base:llamacpp
      - task: pii:llamacpp
      - task: gliguard:llamacpp
      - task: gliner2dot5-small:llamacpp

  model:clean:llamacpp:
    desc: Remove every llama.cpp / ggml engine bundle (models/*-llamacpp)
    cmds:
      - rm -rf models/*-llamacpp

  # ── GLiClass model chain (knowledgator/gliclass-modern-base-v3.0) ───────────

  gliclass:
    desc: Export the GLiClass model to ONNX (encoder + score_head; FP32 + FP16 + INT8; verified vs PyTorch). Downloads the model from HuggingFace on first run.
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliclass --model-path {{.GLICLASS_HF_MODEL}} --output-dir {{.GLICLASS_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx/score_head.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/onnx_quantized/encoder.onnx"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/gliner4j_config.json"
      - "{{.GLICLASS_ONNX_OUTPUT_DIR}}/tokenizer.json"

  model:clean:gliclass:
    desc: Remove exported GLiClass model files
    prompt: This will delete all GLiClass model files. Continue?
    cmds:
      - rm -rf {{.GLICLASS_ONNX_OUTPUT_DIR}}

  demo:gliclass:
    desc: 'Run the GLiNER4j demo against the GLiClass zero-shot topic-classification profile (override VARIANT=onnx, EP=cuda|openvino|coreml)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-sentiment:
    desc: 'Run the GLiNER4j demo against the GLiClass zero-shot sentiment/emotion profile (same model, different labels)'
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_sentiment {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── GLiClass V3 config-swap variants (no Java changes — same engine, export & load) ─────────
  # Builds FP32 + FP16 + INT8 (QInt8) like `task gliclass`; override EXPORT_ARGS to change variants.

  gliclass:x:
    desc: "Export GLiClass-X (multilingual, mdeberta-v3-base) — zero-shot classification across 20+ languages"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliclass --model-path {{.GLICLASS_X_HF_MODEL}} --output-dir {{.GLICLASS_X_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLICLASS_X_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:modern-large:
    desc: "Export GLiClass modern-large v3 (ModernBERT-large) — highest-accuracy zero-shot classifier"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliclass --model-path {{.GLICLASS_MODERN_LARGE_HF_MODEL}} --output-dir {{.GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLICLASS_MODERN_LARGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:large:
    desc: "Export GLiClass large v3 (deberta-v3-large, mlp scorer)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliclass --model-path {{.GLICLASS_LARGE_HF_MODEL}} --output-dir {{.GLICLASS_LARGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLICLASS_LARGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  gliclass:edge:
    desc: "Export GLiClass edge v3 (ettin-32m, tiny/fast)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliclass --model-path {{.GLICLASS_EDGE_HF_MODEL}} --output-dir {{.GLICLASS_EDGE_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLICLASS_EDGE_ONNX_OUTPUT_DIR}}/onnx/encoder.onnx"

  demo:gliclass-multilang:
    desc: "Run the demo: GLiClass-X multilingual zero-shot topic classification (needs: task gliclass:x)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_multilang {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-edge:
    desc: "Run the demo: GLiClass edge zero-shot intent classification (tiny/fast; needs: task gliclass:edge)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_edge {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-modern-large:
    desc: "Run the demo: GLiClass zero-shot topic classification (ModernBERT-large; needs: task gliclass:modern-large)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_modern_large {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliclass-large:
    desc: "Run the demo: GLiClass zero-shot topic classification (DeBERTa-v3-large; needs: task gliclass:large)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliclass_large {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── GLiNER2.5 (fastino boundary architecture — export & load) ────────────────
  # One merged ner_full.onnx (encoder + boundary head + shared candidate pool) + classifier_full.onnx.
  # FP32 + FP16 + INT8 (QInt8); DeBERTa-patched (0 If nodes) + name-sanitized (OpenVINO-ready).

  gliner2dot5:
    desc: "Export GLiNER2.5 base (deberta-v3-base) — span-free zero-shot NER + classification (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2dot5 --model-path {{.GLINER2DOT5_HF_MODEL}} --output-dir {{.GLINER2DOT5_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py gliner2dot5-base {{.GLINER2DOT5_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER2DOT5_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"
      - "{{.GLINER2DOT5_ONNX_OUTPUT_DIR}}/onnx/classifier_full.onnx"

  gliner2dot5-small:
    desc: "Export GLiNER2.5 small (deberta-v3-xsmall, 74M) — the bundle the integration tests use"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2dot5 --model-path {{.GLINER2DOT5_SMALL_HF_MODEL}} --output-dir {{.GLINER2DOT5_SMALL_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py gliner2dot5-small {{.GLINER2DOT5_SMALL_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER2DOT5_SMALL_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"

  gliner2dot5-multi:
    desc: "Export GLiNER2.5 multilingual (mdeberta-v3-base)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner2dot5 --model-path {{.GLINER2DOT5_MULTI_HF_MODEL}} --output-dir {{.GLINER2DOT5_MULTI_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
      - uv run scripts/render_model_card.py gliner2dot5-multi {{.GLINER2DOT5_MULTI_ONNX_OUTPUT_DIR}}/README.md
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER2DOT5_MULTI_ONNX_OUTPUT_DIR}}/onnx/ner_full.onnx"

  demo:gliner2dot5:
    desc: "Run the demo: GLiNER2.5 base NER + classification (needs: task gliner2dot5; VARIANT=onnx_fp16|onnx_quantized, EP=cuda|openvino|coreml)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner2dot5 {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliner2dot5-small:
    desc: "Run the demo: GLiNER2.5 small (needs: task gliner2dot5-small)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner2dot5_small {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliner2dot5-multi:
    desc: "Run the demo: GLiNER2.5 multilingual (needs: task gliner2dot5-multi)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner2dot5_multi {{.VARIANT}} {{.EP}}" 2>/dev/null

  # ── GLiNER NER families (uni/bi-encoder span — export & load) ────────────────
  # Builds FP32 + FP16 + INT8 (QInt8); all DeBERTa-patched (0 If nodes) + name-sanitized (OpenVINO-ready).

  gliner-pii:
    desc: "Export GLiNER-PII (uni-encoder, deberta-v3-small) — zero-shot PII NER (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner-uni --model-path {{.GLINER_PII_HF_MODEL}} --output-dir {{.GLINER_PII_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER_PII_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  gliner-bi:
    desc: "Export GLiNER bi-encoder (deberta text + MiniLM label) — zero-shot NER (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner-uni --model-path {{.GLINER_BI_HF_MODEL}} --output-dir {{.GLINER_BI_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER_BI_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  demo:gliner-pii:
    desc: "Run the demo: GLiNER-PII zero-shot PII NER (uni-encoder; needs: task gliner-pii)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_pii {{.VARIANT}} {{.EP}}" 2>/dev/null

  demo:gliner-bi:
    desc: "Run the demo: GLiNER bi-encoder zero-shot NER (dual encoder; needs: task gliner-bi)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_bi {{.VARIANT}} {{.EP}}" 2>/dev/null

  gliner-x:
    desc: "Export GLiNER-X (mT5 multilingual NER). Whitespace-split approximation — EU langs only, no CJK (see TODO)."
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner-uni --model-path {{.GLINER_X_HF_MODEL}} --output-dir {{.GLINER_X_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER_X_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  demo:gliner-x:
    desc: "Run the demo: GLiNER-X multilingual zero-shot NER (EU languages; needs: task gliner-x)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_x {{.VARIANT}} {{.EP}}" 2>/dev/null

  gliner-multitask:
    desc: "Export GLiNER Multitask (token_level, deberta-v3-large) — zero-shot NER (FP32 + FP16 + INT8)"
    deps:
      - check:uv
    cmds:
      - uv run scripts/export_onnx.py gliner-uni --model-path {{.GLINER_MULTITASK_HF_MODEL}} --output-dir {{.GLINER_MULTITASK_ONNX_OUTPUT_DIR}} {{.EXPORT_ARGS | default "--variant fp16 --variant quantized"}}
    sources:
      - scripts/export_onnx.py
    generates:
      - "{{.GLINER_MULTITASK_ONNX_OUTPUT_DIR}}/onnx/model.onnx"

  demo:gliner-multitask:
    desc: "Run the demo: GLiNER Multitask token_level zero-shot NER (needs: task gliner-multitask)"
    deps:
      - check:maven
    vars:
      VARIANT: '{{.VARIANT | default "onnx"}}'
      EP: '{{.EP | default "cpu"}}'
    cmds:
      - mvn exec:java -pl gliner4j-demo {{.MVN_FLAGS | default ""}} -Dexec.args="gliner_multitask {{.VARIANT}} {{.EP}}" 2>/dev/null
